<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveGuard · 直播间巡检</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/inspect"><span>LG</span><b>LiveGuard</b><small>单次页面检查</small></a>
    <a href="/" style="color:#237a45;font-size:12px;text-decoration:none;font-weight:bold">返回个人监控室 →</a>
  </header>

  <main>
    <section class="page-head">
      <div><p>辅助工具</p><h1>单次页面检查</h1></div>
      <div class="metrics">
        <span><b id="runningCount">0</b>执行中</span>
        <span><b id="passedCount">0</b>正常</span>
        <span><b id="attentionCount">0</b>需处理</span>
      </div>
    </section>

    <section class="workspace">
      <form id="taskForm" class="panel form-panel">
        <div class="panel-title"><span>新建巡检</span><div class="mode-tabs" role="tablist"><button class="active" data-mode="single" type="button">单个</button><button data-mode="batch" type="button">批量</button></div></div>
        <label id="singleURLField">直播间地址
          <input id="url" name="url" type="url" placeholder="https://live.douyin.com/房间号" required autocomplete="off">
        </label>
        <section id="batchFields" class="batch-fields hidden">
          <label>批次名称 <small>选填</small>
            <input id="campaignName" maxlength="80" placeholder="例如：晚间重点直播间">
          </label>
          <label>直播间地址 <small>每行一个，最多 50 个</small>
            <textarea id="batchURLs" rows="7" placeholder="https://live.douyin.com/房间号1&#10;https://live.douyin.com/房间号2"></textarea>
          </label>
        </section>
        <div class="form-row">
          <label>需要确认的页面内容 <small>选填，用逗号分隔</small>
            <input id="expectedTexts" placeholder="例如：主播昵称，活动入口">
          </label>
          <label>预期状态
            <select id="expectedLiveStatus">
              <option value="any">只检查页面</option>
              <option value="live" selected>应该正在直播</option>
              <option value="offline">应该未开播</option>
            </select>
          </label>
        </div>

        <section class="login-card">
          <div><b>抖音登录态</b><span id="sessionStatus">正在检查…</span></div>
          <button id="openSession" type="button">打开登录窗口</button>
          <label class="check-row"><input id="useSession" type="checkbox" checked> 使用已登录的抖音账号巡检</label>
        </section>

        <button id="submitTask" class="primary" type="submit"><span id="submitLabel">开始巡检</span><span>→</span></button>
        <p id="formError" class="error" role="alert"></p>
      </form>

      <section class="panel results-panel">
        <div class="panel-title"><span id="resultsTitle">最近结果</span><button id="refresh" type="button">刷新</button></div>
        <div id="campaignList" class="campaign-list hidden"></div>
        <div id="taskList" class="task-list"><div class="empty">还没有巡检记录</div></div>
      </section>
    </section>

    <section id="detail" class="panel detail hidden">
      <div class="panel-title">
        <div><span>巡检结果</span><small id="detailTime"></small></div>
        <div class="detail-actions"><button id="retryTask" class="hidden" type="button">重新巡检</button><button id="closeDetail" type="button">收起</button></div>
      </div>
      <div class="result-head">
        <div><span id="detailStatus" class="result-badge"></span><h2 id="detailSummary">正在执行…</h2><a id="detailURL" target="_blank" rel="noreferrer"></a></div>
        <div id="resultContract" class="result-contract"></div>
      </div>
      <div id="failureHelp" class="failure-help hidden"></div>
      <div class="evidence-grid">
        <section><h3>页面截图</h3><div id="screenshot" class="screenshot"><span>完成后显示截图</span></div></section>
        <section><h3>检查结果</h3><div id="checks" class="checks"><div class="empty small">正在等待结果</div></div></section>
      </div>
      <details class="simple-log"><summary>查看处理记录</summary><ol id="timeline"></ol></details>
    </section>
  </main>

  <footer>LiveGuard · 只读取页面，不执行关注、评论、点赞或送礼操作</footer>
  <script src="/static/app.js"></script>
</body>
</html>
