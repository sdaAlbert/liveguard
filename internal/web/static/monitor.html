<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveGuard</title>
  <link rel="stylesheet" href="/static/monitor.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">L</span>LiveGuard</a>
    <button id="douyinLogin" type="button"><span class="login-dot"></span>登录抖音</button>
  </header>

  <main>
    <form id="monitorForm" class="monitor-form">
      <div class="form-heading"><span class="form-icon">＋</span><h1>新建监控</h1></div>
      <label>直播链接<input id="targetURL" type="url" placeholder="粘贴直播间 URL" required autocomplete="off"></label>
      <label>关注内容<input id="monitorGoal" type="text" maxlength="240" placeholder="例如：聊天区提到抽奖，或主播宣布开始活动" required></label>
      <button id="openMonitor" type="submit"><span>开始监控</span><b>→</b></button>
      <p id="formError" class="form-error" role="alert"></p>
    </form>

    <div class="room-heading"><div><h1>监控中</h1><small>直播提醒会显示在对应卡片里</small></div><span id="roomCount">0</span></div>
    <section id="emptyRoom" class="empty-room"><span class="empty-mark">＋</span><p>添加直播链接，开始你的第一个监控</p></section>
    <section id="monitorGrid" class="monitor-grid hidden" aria-live="polite"></section>
  </main>

  <template id="monitorCard">
    <article class="monitor-card">
      <header class="card-head">
        <div><b class="room-name"></b><span class="window-status"></span></div>
        <button class="stop-monitor" type="button" aria-label="停止监控"><span></span>停止</button>
      </header>
      <form class="goal-edit">
        <label>监控需求<input class="goal-input" type="text" maxlength="240" required></label>
        <button class="goal-save" type="submit">更新</button>
        <span class="goal-status" role="status"></span>
      </form>
      <section class="alert-list"></section>
      <details class="card-detail">
        <summary>详情</summary>
        <div class="detail-content">
          <a class="room-link" target="_blank" rel="noreferrer"></a>
          <p class="plan-summary"></p>
          <p class="latest-signal"></p>
          <p class="capture-error"></p>
          <p class="window-stats"><span class="card-signals">0</span> 条信号 · <span class="card-investigations">0</span> 次判断</p>
          <div class="decision-list"></div>
          <button class="audio-capture" type="button">开启口播识别</button>
        </div>
      </details>
    </article>
  </template>

  <script src="/static/monitor.js"></script>
</body>
</html>
