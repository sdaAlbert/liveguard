name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check browser UI JavaScript
        run: node --check internal/web/static/app.js
