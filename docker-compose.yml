name: liveguard-infra

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: liveguard
      POSTGRES_USER: liveguard
      POSTGRES_PASSWORD: liveguard_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - liveguard_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveguard -d liveguard"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - liveguard_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
    depends_on:
      - jaeger

volumes:
  liveguard_postgres:
  liveguard_redis:
